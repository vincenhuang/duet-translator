<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>對面說 Duet</title>
<style>
/* Layout: 兩人面對面，上半部旋轉 180°，各自一個說話鍵 */
:root{
  --bg:#eef1f4; --panel:#ffffff; --fg:#17202a; --muted:#6a7684;
  --a:#1f6feb; --b:#c2410c; --line:#d6dce3;
  --display:"Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#0f1418;--panel:#182028;--fg:#e8edf2;--muted:#8d99a6;--a:#5a9bff;--b:#f08a4b;--line:#2a3540;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.msg{-webkit-user-select:text;user-select:text}
body{background:var(--bg);color:var(--fg);font-family:var(--display);display:flex;flex-direction:column;gap:8px;padding:8px 16px}
.side{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;padding:12px;gap:10px}
.side.top{transform:rotate(180deg)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.msg{max-width:85%;padding:8px 12px;border-radius:12px;line-height:1.45}
.msg small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.mine{align-self:flex-end;background:var(--bg)}
.theirs{align-self:flex-start;border:2px solid var(--c);font-size:1.2em}
.talk{-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;border:0;border-radius:999px;padding:14px;font:600 17px var(--display);color:#fff;background:var(--c);cursor:pointer;user-select:none;touch-action:none}
.talk.on{animation:pulse 1s infinite}
.talk:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.talk.on{animation:none;outline:3px dashed var(--fg)}}
.live{color:var(--muted);font-size:14px;min-height:1.2em}
.hint{color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<section class="side top" id="B" style="--c:var(--b)"></section>
<label class="hint"><input type="checkbox" id="tts" checked> 我說的話自動唸給對方聽</label>
<div class="hint" id="hint">準備辨識模型中…</div>
<section class="side" id="A" style="--c:var(--a)"></section>

<script type="module">
import {pipeline,env} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2";
env.allowLocalModels=false;
const LANGS=[["zh-TW","中文","chinese"],["en-US","English","english"],["ja-JP","日本語","japanese"],["ko-KR","한국어","korean"],["fr-FR","Français","french"],["de-DE","Deutsch","german"],["es-ES","Español","spanish"],["th-TH","ไทย","thai"],["vi-VN","Tiếng Việt","vietnamese"]];
const sides={};
const hint=document.getElementById("hint");
const IDLE="點一下按鈕開始說話，說完再點一下送出翻譯";

function build(id,def,label){
  const el=document.getElementById(id);
  el.innerHTML=`<div class="bar"><strong>${label}</strong><select id="lang${id}" aria-label="語言">${LANGS.map(([c,n])=>`<option value="${c}"${c===def?" selected":""}>${n}</option>`).join("")}</select></div>
  <div class="log" id="log${id}"></div><div class="live" id="live${id}"></div>
  <button class="talk" id="btn${id}">點我說話</button>`;
  sides[id]={lang:()=>document.getElementById("lang"+id).value,log:document.getElementById("log"+id),live:document.getElementById("live"+id),btn:document.getElementById("btn"+id)};
}
build("A","zh-TW","我");
build("B","en-US","對方");
const other=id=>id==="A"?"B":"A";

function add(id,cls,text,sub){
  const d=document.createElement("div");d.className="msg "+cls;
  d.textContent=text;if(sub){const s=document.createElement("small");s.textContent=sub;d.append(s)}
  sides[id].log.append(d);sides[id].log.scrollTop=1e9;
}

async function translate(text,from,to){
  const f=from.split("-")[0],t=to.split("-")[0];
  const g=c=>c==="zh"?"zh-TW":c;
  if(f===t&&f!=="zh")return text;
  try{
    const r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${f==="zh"?"auto":g(f)}&tl=${g(t)}&dt=t&q=${encodeURIComponent(text)}`);
    const j=await r.json();return j[0].map(x=>x[0]).join("");
  }catch(e){
    const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`);
    return (await r.json()).responseData.translatedText;
  }
}

function speak(text,lang){
  if(!document.getElementById("tts").checked)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang=lang;
  const v=speechSynthesis.getVoices().find(v=>v.lang.replace("_","-").startsWith(lang.split("-")[0]));
  if(v)u.voice=v;speechSynthesis.speak(u);
}

// 語音辨識：手機本機跑 Whisper，不靠瀏覽器內建辨識（iOS 那個換語言、朗讀後就收不到音）
let asr=null,asrErr=null;
const asrReady=pipeline("automatic-speech-recognition","onnx-community/whisper-base",{dtype:"q8",device:"wasm",
  progress_callback:p=>{if(p.status==="progress"&&p.file.endsWith(".onnx"))hint.textContent=`第一次使用，下載辨識模型中… ${Math.round(p.progress)}%`}
}).then(p=>{asr=p;hint.textContent=IDLE}).catch(e=>{asrErr=e;hint.textContent="辨識模型載入失敗，請重新整理（"+(e.message||e)+"）"});

async function toMono16k(blob){
  const buf=await blob.arrayBuffer();
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  const audio=await ac.decodeAudioData(buf);ac.close();
  const off=new OfflineAudioContext(1,Math.ceil(audio.duration*16000),16000);
  const src=off.createBufferSource();src.buffer=audio;src.connect(off.destination);src.start();
  return (await off.startRendering()).getChannelData(0);
}

let recorder=null,stream=null,active=null,chunks=[],busy=false;
function setBtn(id,on,text){sides[id].btn.classList.toggle("on",on);sides[id].btn.textContent=text}

async function start(id){
  if(busy)return;
  if(!asr){hint.textContent=asrErr?"辨識模型載入失敗，請重新整理":"辨識模型還在下載，請稍等…";return}
  speechSynthesis.cancel();
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){hint.textContent="無法使用麥克風，請到瀏覽器設定允許麥克風";return}
  chunks=[];active=id;
  recorder=new MediaRecorder(stream);
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onstop=()=>finish(id,new Blob(chunks,{type:recorder.mimeType}));
  recorder.start();
  setBtn(id,true,"錄音中…點一下送出");hint.textContent="錄音中（"+sides[id].lang()+"）…";
}
function stop(){
  if(recorder&&recorder.state==="recording")recorder.stop();
  if(stream)stream.getTracks().forEach(t=>t.stop());
}
async function finish(id,blob){
  recorder=null;stream=null;active=null;busy=true;
  setBtn(id,false,"辨識中…");hint.textContent="辨識中…";
  try{
    const audio=await toMono16k(blob);
    if(audio.length<16000*0.4)throw new Error("short");
    const lang=LANGS.find(l=>l[0]===sides[id].lang())[2];
    const out=await asr(audio,{language:lang,task:"transcribe",chunk_length_s:30});
    let text=(out.text||"").trim();
    if(!text)throw new Error("empty");
    hint.textContent="翻譯中…";
    const o=other(id),from=sides[id].lang(),to=sides[o].lang();
    if(from==="zh-TW")text=await translate(text,"zh-CN","zh-TW").catch(()=>text); // Whisper 常輸出簡體，轉成繁體
    let t;
    try{t=await translate(text,from,to)}catch(e){add(id,"mine",text,"翻譯失敗，請檢查網路連線");hint.textContent="翻譯失敗";return}
    add(id,"mine",text,t);add(o,"theirs",t,text);if(id==="A")speak(t,to); // 只有我這邊送出才唸給對方聽hint.textContent=IDLE;
  }catch(e){
    hint.textContent=(e.message==="short"||e.message==="empty")?"沒有聽到內容，請再點一次說話":"辨識失敗："+(e.message||e);
  }finally{busy=false;setBtn(id,false,"點我說話")}
}
for(const id of ["A","B"]){
  const b=sides[id].btn;
  b.addEventListener("click",()=>{active===id?stop():(active?null:start(id))});
  b.addEventListener("contextmenu",e=>e.preventDefault());
}
speechSynthesis.getVoices();
</script>
</body>
</html>
